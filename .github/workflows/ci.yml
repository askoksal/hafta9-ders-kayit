name: Hafta 9 CI ve Imaj Yayimlama
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hafta9-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Uygulama Testleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test imajini olustur
        run: docker build --target test -t hafta9-tests .
      - name: Testleri calistir
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges hafta9-tests
      - name: Calisma imajini olustur
        run: docker build --target runtime --build-arg SOURCE_COMMIT=${{ github.sha }} -t hafta9-runtime .
      - name: Imaj guvenlik ve HTTP kontrolu
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect hafta9-runtime --format '{{.Config.User}}')" = '10001:10001'
          export API_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name hafta9-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -e API_TOKEN hafta9-runtime
          trap 'docker logs hafta9-smoke || true; docker rm -f hafta9-smoke >/dev/null' EXIT
          curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/readyz
          curl --fail http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert json.load(sys.stdin)["commit"] == sys.argv[1]' '${{ github.sha }}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"student_id":"DEMO001","course_id":"BULUT101"}' http://127.0.0.1:18080/api/enrollments)" = '401'
  terraform:
    name: Terraform Kontrolleri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Bicim denetimi
        run: terraform fmt -check -recursive infra
      - name: Saglayici semasi ve yapilandirma
        shell: bash
        run: |
          set -euo pipefail
          for directory in infra/bootstrap infra/local infra/modules/course_service; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
      - name: Gercek kumeye baglanmadan sozlesme testleri
        run: terraform -chdir=infra/modules/course_service test
  powershell:
    name: Windows PowerShell Kontrolleri
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 ile betik korumalarini denetle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem ./scripts/*.ps1,./tests/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
          ./tests/Test-ScriptSafety.ps1
  publish:
    name: Dogrulanan Imaji Yayimla
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, terraform, powershell]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Imaj adini belirle
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hafta9-ders-kayit" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Yayimlanacak ciktiyi olustur ve ayni ciktiyi kontrol et
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --target runtime --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          export API_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name hafta9-release --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 -e API_TOKEN "$IMAGE:$GITHUB_SHA"
          trap 'docker rm -f hafta9-release >/dev/null' EXIT
          curl --fail --show-error --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:18080/readyz
          curl --fail http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert json.load(sys.stdin)["commit"] == sys.argv[1]' "$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Dagitim Kimligi'
            echo "Kaynak commit: $GITHUB_SHA"
            echo "Imaj: $IMAGE@$DIGEST"
            echo 'Yerelde Plan-Local.ps1 betigine bu iki degeri verin.'
          } >> "$GITHUB_STEP_SUMMARY"
